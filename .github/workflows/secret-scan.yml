name: security · secret scan

# Backstop en el servidor: se ejecuta pase lo que pase, aunque alguien haga
# commit con --no-verify o no tenga los hooks locales instalados.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks + env guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para escanear TODOS los commits, no solo el último

      # Capa 1 — Guardián de archivos de entorno.
      # gitleaks no marca un .env genérico (contraseñas/keys sin patrón conocido),
      # así que esta comprobación explícita bloquea el error que causó la fuga:
      # versionar un .env. Permite plantillas .env.example / .sample / .template.
      - name: Ningún archivo .env versionado
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -vE '(^|/)\.env\.(example|sample|template)$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "::error::Hay archivos de entorno versionados (deben ir en .gitignore y NUNCA al repo):"
            printf '%s\n' "$tracked_env"
            echo "Solución: git rm --cached <archivo>  ·  y ROTAR las credenciales expuestas."
            exit 1
          fi
          echo "OK · no hay archivos .env versionados."

      # Capa 2 — gitleaks sobre todo el historial de git.
      - name: gitleaks · escanear secretos
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          # --exit-code 1 hace fallar el job si encuentra secretos.
          /tmp/gitleaks git . --redact --verbose --exit-code 1
