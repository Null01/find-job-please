<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FindJob IA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --border:#e5e8ee;
            --text:#1a1d24; --muted:#5f6b7c; --faint:#8a94a6; --accent:#2d6cdf;
            --accent-soft:#e8f0ff; --green:#159a63; --green-soft:#e2f5ec;
            --amber:#b7791f; --amber-soft:#fbf0d9;
            --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
            --radius:14px; --side:232px;
        }
        @media (prefers-color-scheme: dark){:root{
            --bg:#0c0e13; --surface:#14171f; --surface-2:#1b1f29; --border:#252a35;
            --text:#e8eaef; --muted:#9aa4b5; --faint:#6b7688; --accent:#4d8bff;
            --accent-soft:#172236; --green:#4ade80; --green-soft:#14271c;
            --amber:#f0b849; --amber-soft:#2a2113; --shadow:0 1px 2px rgba(0,0,0,.3);
        }}
        *{box-sizing:border-box;} [hidden]{display:none!important;}
        html{-webkit-text-size-adjust:100%;}
        body{margin:0; background:var(--bg); color:var(--text);
            font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
            font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
        a{color:inherit; text-decoration:none;}

        /* ---------- Shell: sidebar + main ---------- */
        .sidebar{position:fixed; left:0; top:0; bottom:0; width:var(--side); z-index:40;
            background:var(--surface); border-right:1px solid var(--border);
            display:flex; flex-direction:column; padding:16px 12px; transition:transform .2s;}
        .brand{display:flex; align-items:center; gap:9px; font-weight:600; font-size:18px;
            color:var(--text); font-family:"Source Serif 4",Georgia,serif; padding:6px 8px 14px;}
        .brand .logo{width:30px; height:30px; border-radius:9px; flex:none;
            background:linear-gradient(135deg,var(--accent),#7db1ff);
            display:grid; place-items:center; font-size:16px;}
        .nav{display:flex; flex-direction:column; gap:3px;}
        .nav-item{display:flex; align-items:center; gap:11px; padding:9px 11px;
            border-radius:10px; color:var(--muted); font-weight:600; font-size:14.5px;}
        .nav-item:hover{background:var(--surface-2); color:var(--text);}
        .nav-item.active{background:var(--accent-soft); color:var(--accent);}
        .nav-item .ni{font-size:16px; width:20px; text-align:center;}
        .side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
        .who{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
            padding:4px 6px 10px; overflow:hidden;}
        .who-mail{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
        .main{margin-left:var(--side); min-height:100vh;}
        .content{max-width:1080px; margin:0 auto; padding:24px;}

        /* Barra móvil */
        .mobilebar{display:none; align-items:center; gap:12px; padding:12px 16px;
            border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
            background:color-mix(in srgb,var(--surface) 90%,transparent); backdrop-filter:blur(10px);}
        .ham{font-size:20px; background:none; border:none; color:var(--text); cursor:pointer;}
        .mb-title{font-weight:600; font-family:"Source Serif 4",Georgia,serif;}
        .scrim{display:none; position:fixed; inset:0; background:rgba(8,10,14,.5); z-index:30;}

        @media (max-width:860px){
            .sidebar{transform:translateX(-100%);}
            .sidebar.open{transform:none;}
            .main{margin-left:0;}
            .mobilebar{display:flex;}
            .scrim.show{display:block;}
        }

        /* ---------- Page header ---------- */
        .page-head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap;
            justify-content:space-between; margin-bottom:20px;}
        .page-head h1{font-size:24px; margin:0 0 8px; letter-spacing:-.01em;}
        .kpis{display:flex; gap:8px; flex-wrap:wrap;}
        .head-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

        /* ---------- Componentes compartidos ---------- */
        .stat{display:inline-flex; align-items:baseline; gap:6px; background:var(--surface-2);
            border:1px solid var(--border); padding:5px 11px; border-radius:999px;
            font-size:13px; color:var(--muted);}
        .stat b{font-size:14px; color:var(--text); font-variant-numeric:tabular-nums;}

        .btn{font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; line-height:1;
            padding:9px 14px; border-radius:10px; border:1px solid var(--accent);
            background:var(--accent); color:#fff; box-shadow:var(--shadow);
            display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
            transition:filter .15s, background .15s;}
        .btn:hover{filter:brightness(1.06); text-decoration:none;}
        .btn:disabled{opacity:.6; cursor:default; filter:none;}
        .btn.ghost{background:transparent; color:var(--muted); border-color:var(--border);}
        .btn.ghost:hover{background:var(--surface-2); filter:none; color:var(--text);}
        .btn.green{background:var(--green-soft); color:var(--green); border-color:transparent;}
        .btn.green:hover{filter:brightness(.97);}
        .btn.soft{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
        .btn.sm{padding:7px 12px; font-size:13px;}
        .btn.w100{width:100%; justify-content:center;}

        input, select, textarea{font:inherit; font-size:14px; color:var(--text);
            background:var(--surface); border:1px solid var(--border); border-radius:10px;
            padding:9px 12px; transition:border-color .15s, box-shadow .15s;}
        input:focus, select:focus, textarea:focus{outline:none; border-color:var(--accent);
            box-shadow:0 0 0 3px var(--accent-soft);}

        .card{background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow);
            margin-bottom:18px;}
        .card h2{font-size:13px; text-transform:uppercase; letter-spacing:.04em;
            color:var(--faint); margin:0 0 14px;}

        .spinner{width:13px; height:13px; border-radius:50%; border:2px solid currentColor;
            border-top-color:transparent; animation:spin .7s linear infinite;}
        .spinner.big{width:34px; height:34px; border-width:3px; color:var(--accent);}
        @keyframes spin{to{transform:rotate(360deg);}}

        .blocker{position:fixed; inset:0; z-index:60; display:grid; place-items:center;
            background:rgba(8,10,14,.72); backdrop-filter:blur(2px);}
        .blocker-box{display:flex; flex-direction:column; align-items:center; gap:16px;
            color:#fff; font-size:15px; font-weight:600; text-align:center; padding:0 24px;}

        /* ---------- Iconos (Lucide) ---------- */
        .lucide{width:18px; height:18px; stroke-width:2; flex:none;}
        .lx{width:1em; height:1em; vertical-align:-.15em; stroke-width:2; flex:none;}
        .btn .lucide, .btn .lx{width:16px; height:16px;}
        .brand .logo .lucide{width:18px; height:18px; color:#fff; stroke-width:2.2;}
        .nav-item .ni{width:18px; height:18px; text-align:initial;}
        .who .ni{width:16px; height:16px;}
        .ham .lucide{width:22px; height:22px;}
        {% block extra_head %}{% endblock %}
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="{% url 'jobs:list' %}"><span class="logo"><i data-lucide="compass"></i></span> FindJob IA</a>
        <nav class="nav">
            <a href="{% url 'jobs:list' %}" class="nav-item {% if request.resolver_match.url_name == 'list' %}active{% endif %}">
                <i data-lucide="briefcase" class="ni"></i> Ofertas</a>
            <a href="{% url 'jobs:profile' %}" class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                <i data-lucide="user" class="ni"></i> Perfil</a>
            {% if user.is_staff %}
            <a href="/admin/" class="nav-item"><i data-lucide="settings" class="ni"></i> Admin</a>
            {% endif %}
        </nav>
        <div class="side-foot">
            <div class="who"><i data-lucide="mail" class="ni"></i><span class="who-mail">{{ user.email }}</span></div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn ghost sm w100" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </aside>

    <div class="main">
        <div class="mobilebar">
            <button class="ham" id="ham" aria-label="Abrir menú"><i data-lucide="menu"></i></button>
            <span class="mb-title">FindJob IA</span>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    <div class="scrim" id="scrim"></div>

    <script>
    (function(){
        const sb=document.getElementById("sidebar"), sc=document.getElementById("scrim"),
              ham=document.getElementById("ham");
        function toggle(open){ sb.classList.toggle("open",open); sc.classList.toggle("show",open); }
        if(ham) ham.addEventListener("click",()=>toggle(!sb.classList.contains("open")));
        if(sc) sc.addEventListener("click",()=>toggle(false));
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.45.0/dist/umd/lucide.min.js"></script>
    <script>window.lucide && lucide.createIcons();</script>
    {% block scripts %}{% endblock %}
</body>
</html>
