<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FindJob IA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#f7f8fa; --surface:#fff; --surface-2:#f1f3f6; --border:#e3e7ee;
            --text:#1a1d24; --muted:#5f6b7c; --faint:#8a94a6; --accent:#2d6cdf;
            --accent-soft:#e8f0ff; --shadow:0 1px 3px rgba(16,24,40,.08);
        }
        @media (prefers-color-scheme: dark){:root{
            --bg:#0d0f14; --surface:#161922; --surface-2:#1d212c; --border:#262b37;
            --text:#e8eaef; --muted:#9aa4b5; --faint:#6b7688; --accent:#4d8bff;
            --accent-soft:#172236; --shadow:0 1px 2px rgba(0,0,0,.3);
        }}
        *{box-sizing:border-box;}
        body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
            background:var(--bg); color:var(--text);
            font-family:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;}
        .card{width:100%; max-width:400px; background:var(--surface);
            border:1px solid var(--border); border-radius:16px; padding:30px;
            box-shadow:var(--shadow);}
        .brand{display:flex; align-items:center; gap:9px; font-weight:600; font-size:20px;
            font-family:"Source Serif 4",Georgia,serif; margin-bottom:4px;}
        .brand .logo{width:32px; height:32px; border-radius:9px;
            background:linear-gradient(135deg,var(--accent),#7db1ff);
            display:grid; place-items:center; font-size:17px;}
        h1{font-size:19px; margin:14px 0 4px;}
        .sub{color:var(--muted); font-size:14px; margin:0 0 20px;}
        label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
        input{width:100%; font:inherit; font-size:15px; color:var(--text);
            background:var(--surface); border:1px solid var(--border);
            border-radius:10px; padding:11px 13px;}
        input:focus{outline:none; border-color:var(--accent);
            box-shadow:0 0 0 3px var(--accent-soft);}
        .btn{width:100%; margin-top:22px; font:inherit; font-size:15px; font-weight:600;
            cursor:pointer; padding:12px; border-radius:10px; border:1px solid var(--accent);
            background:var(--accent); color:#fff;}
        .btn:hover{filter:brightness(1.06);}
        .alt{margin-top:18px; text-align:center; font-size:14px; color:var(--muted);}
        .alt a{color:var(--accent); font-weight:600; text-decoration:none;}
        .errors{background:#fce8e6; color:#b3261e; font-size:13px; padding:9px 12px;
            border-radius:9px; margin-top:12px;}
        .errors ul{margin:0; padding-left:18px;}
        .errors li{margin:2px 0;}
        .errors .more{font-size:11.5px; opacity:.85; margin-top:5px;}
        @media (prefers-color-scheme: dark){.errors{background:#2c1513; color:#ff8a80;}}
        .help{font-size:12px; color:var(--faint); margin-top:4px;}
        .lx{width:1em; height:1em; vertical-align:-.15em; stroke-width:2; flex:none;}
        .brand .logo .lucide{width:18px; height:18px; color:#fff; stroke-width:2.2;}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="card">
        <div class="brand"><span class="logo"><i data-lucide="compass"></i></span> FindJob IA</div>
        {% block body %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.45.0/dist/umd/lucide.min.js"></script>
    <script>window.lucide && lucide.createIcons();</script>
</body>
</html>
